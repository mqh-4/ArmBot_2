services:
  armpi_fpv:
    image: armbot:noetic
    # Restart the service after a host reboot unless it was explicitly stopped.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    device_cgroup_rules:
      # I2C bus for the ArmPi ASR (0x79) and TTS (0x40) modules.
      - 'c 89:* rmw'
      - 'c 189:* rmw'
      - 'c 116:* rmw'
      # Raspberry Pi UART used by the ArmPi servo controller (/dev/ttyAMA0).
      - 'c 204:* rmw'
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/home/ubuntu/share/tmp/ArmBot/src
      - ./config:/home/ubuntu/share/tmp/ArmBot/config
      - ./models:/home/ubuntu/share/tmp/ArmBot/models
      - ./output:/home/ubuntu/share/tmp/ArmBot/output
      - ./tmp:/home/ubuntu/share/tmp/ArmBot/tmp
    working_dir: /home/ubuntu/share/tmp/ArmBot
    command: ["bash", "-lc", "source devel/setup.bash && exec bash"]
    stdin_open: true
    tty: true
